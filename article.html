<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An article from Love Is In The Air, for long-distance couples.">
<title>Article · Love Is In The Air</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#f4e9d4;--card:#fbf5e9;--ink:#2f241b;--muted:#6b5848;--line:#d9c6a5;
  --red:#b4532f;--blue:#b4532f;--onblue:#fdf3e4;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", "Avenir Next", Avenir, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Nunito Sans", "Avenir Next", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--body)}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.08}
p{margin:0}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:3px;padding:12px 22px;font:600 15px var(--body);cursor:pointer;text-decoration:none;background:var(--blue);color:var(--onblue)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

body>nav{position:sticky;top:0;z-index:50;background:#b4532f;color:#fdf3e4;box-shadow:0 1px 0 rgba(47,36,27,.12)}
body>nav .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:14px;gap:16px}
.logo{font:600 24px var(--display);display:flex;align-items:center;gap:10px;text-decoration:none;color:#fdf3e4}
.logo svg{flex:none}
.back{font-weight:600;font-size:15px;color:#fdf3e4;text-decoration:none}
.back:hover{text-decoration:underline}
@media (max-width:480px){.logo{font-size:19px;gap:8px}.back{font-size:14px}}
/* reading progress, a thin cream line under the bar */
.progress{position:absolute;left:0;bottom:-3px;height:3px;width:100%;background:#f2b79f;transform-origin:0 50%;transform:scaleX(0)}

.k-apart{--tile:linear-gradient(160deg,#cad6e5,#97adc9);--tag:#55709a}
.k-together{--tile:linear-gradient(160deg,#f6c9b0,#df8e6b);--tag:#b4532f}
.k-arcade{--tile:linear-gradient(160deg,#f9cdbb,#ee927a);--tag:#b8473a}
.k-table{--tile:linear-gradient(160deg,#f6dcb8,#e2ad7b);--tag:#94552a}
.k-plus{--tile:linear-gradient(160deg,#b45a35,#7a3219);--tag:#94552a}
.clay{--sz:84px;position:relative;z-index:1;display:grid;place-items:center;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fffaf1 0,#f7e8d2 60%,#ecd5b6 100%);box-shadow:0 10px 18px -10px rgba(80,35,12,.6),inset 0 -4px 7px rgba(160,100,60,.16)}
.clay svg{display:block;width:58%;height:58%}
.tile{position:relative;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.tile::after{content:"";position:absolute;inset:auto -10% -40% auto;width:60%;aspect-ratio:1;border-radius:50%;background:rgba(253,246,235,.28)}

/* header */
.ahero{height:230px}
.ahero .clay{--sz:120px;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.head{max-width:760px;margin:-44px auto 0;position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:34px 40px 30px;display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font:700 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.meta .tag{color:var(--tag)}
.meta .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}
.head h1{font-size:clamp(34px,5vw,54px)}
.head .lede{font-size:19px;color:var(--muted)}
.head .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chipbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font:700 13px var(--body);color:var(--ink);cursor:pointer}
.chipbtn:hover{border-color:var(--blue)}
.chipbtn svg{width:15px;height:15px;color:var(--blue)}
.chipbtn[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.chipbtn[aria-pressed="true"] svg{color:var(--onblue)}
.chipbtn[aria-pressed="true"] svg path{fill:currentColor}
@media (max-width:640px){.ahero{height:170px}.ahero .clay{--sz:92px}.head{margin:-30px 12px 0;padding:24px 20px 22px}}

/* contents + body */
.layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,680px);gap:50px;justify-content:center;padding:44px 0 30px}
.toc{position:sticky;top:96px;align-self:start;display:grid;gap:4px;font-size:14px}
.toc b{font:800 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px}
.toc a{text-decoration:none;color:var(--muted);padding:5px 0 5px 12px;border-left:2px solid var(--line);line-height:1.35;transition:color .2s,border-color .2s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);border-color:var(--blue);font-weight:700}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,680px)}.toc{display:none}}
.body{font-size:18px;line-height:1.75}
.body > p:first-child::first-letter{float:left;font:600 72px/.8 var(--display);color:var(--red);margin:8px 10px 0 0}
.body p{margin:0 0 20px}
.body h2{font-size:clamp(28px,3.4vw,34px);margin:42px 0 14px}
.body ul{margin:0 0 22px;padding:0;list-style:none;display:grid;gap:12px}
.body li{position:relative;padding-left:28px}
.body li::before{content:"";position:absolute;left:4px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #f6dcc8}
.body a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}
.body strong{font-weight:700}
.body blockquote{margin:0 0 20px;padding:2px 0 2px 20px;border-left:3px solid var(--red);font:italic 500 21px/1.45 var(--display);color:var(--ink)}
.body blockquote p{margin:0}
.body blockquote.talkback{display:grid;gap:4px}
.end{display:flex;justify-content:center;margin:34px 0 0;color:var(--red)}
.end svg{width:28px;height:26px}

/* talk about it */
.talk{max-width:680px;margin:20px auto 0;background:#f6e2c8;border-radius:3px;padding:24px 26px;display:grid;gap:10px}
.talk b{font:800 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.talk h3{font-size:26px}
.talk ol{margin:4px 0 0;padding-left:20px;display:grid;gap:6px}

/* keep reading */
.more{padding:60px 0 80px}
.more h2{font-size:clamp(28px,3.6vw,38px);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.post{position:relative;display:grid;grid-template-rows:auto 1fr;background:var(--card);border:1px solid var(--line);border-radius:3px;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s}
.post .tile{aspect-ratio:16/8}
.post .clay{--sz:66px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.post .pbody{display:grid;gap:8px;align-content:start;padding:16px 18px 18px}
.post .meta{justify-content:space-between}
.post h3{font-size:21px;line-height:1.15}
.post:hover{transform:translateY(-5px);box-shadow:0 18px 28px -18px rgba(90,45,20,.55)}
.post:hover .clay{transform:rotate(-9deg) scale(1.08)}
.post:hover h3{color:var(--blue)}
.allbtn{display:flex;justify-content:center;margin-top:30px}
.missing{max-width:600px;margin:0 auto;padding:100px 0;text-align:center;display:grid;gap:14px;justify-items:center}
footer .wrap{padding-block:28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.ahero .clay{animation:none}.post,.post .clay{transition:none}}
.logo img{display:block;height:42px;width:auto}
@media (max-width:480px){.logo img{height:31px}}
footer .flogo{display:block;height:30px;width:auto;margin-bottom:6px}
/* same as the home page: soft color in the side margins, all the way down: washes from the hero palette */
body{position:relative;min-height:100vh}
body::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vw 30% at 0% 22%,rgba(238,160,124,.5),transparent 70%),radial-gradient(38vw 30% at 100% 50%,rgba(150,186,220,.5),transparent 70%),radial-gradient(40vw 30% at 0% 78%,rgba(232,190,130,.5),transparent 70%),radial-gradient(36vw 34% at 100% 20%,rgba(244,170,152,.48),transparent 70%),radial-gradient(34vw 34% at 0% 52%,rgba(150,186,220,.5),transparent 70%),radial-gradient(36vw 34% at 100% 80%,rgba(238,160,124,.5),transparent 70%);
  background-size:100% 1500px,100% 1500px,100% 1500px,100% 1150px,100% 1150px,100% 1150px;
  background-position:0 0,0 0,0 0,0 380px,0 380px,0 380px;
  background-repeat:repeat-y}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html" aria-label="Love Is In The Air home"><picture><source srcset="images/logo-light.webp" type="image/webp"><img src="images/logo-light.png" alt="Love Is In The Air" width="668" height="120"></picture></a>
  <a class="back" href="articles.html">&#8592; All articles</a>
</div><div class="progress" id="progress"></div></nav>

<main id="main"></main>

<footer><div class="wrap"><span><picture><source srcset="images/logo.webp" type="image/webp"><img class="flogo" src="images/logo.png" alt="Love Is In The Air" width="668" height="120" loading="lazy"></picture>© 2026 Love Is In The Air</span><span>Made for couples doing the distance.</span></div></footer>

<script src="js/dates.js?v=0a63679a"></script>
<script src="js/articles.js?v=61d2f6e6"></script>
<script>
(function(){
const ARROW='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const HEART='<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20C3.5 14.4 1.6 9.8 3.9 6.3 5.9 3.5 9.5 3.9 12 6.7 14.5 3.9 18.1 3.5 20.1 6.3 22.4 9.8 20.5 14.4 12 20Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>';
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const icon=(a,cls)=>window.dateIcon?window.dateIcon(a.icon,cls||"",a.k):"";
const main=document.getElementById("main");
const id=new URLSearchParams(location.search).get("a");
const a=window.ARTICLES.find(x=>x.id===id);

if(!a||!a.body){
  main.innerHTML='<div class="wrap missing"><h1>'+(a?"We're still writing this one.":"We couldn't find that article.")+'</h1><p>'+(a?esc(a.sum):"It may have moved.")+'</p><a class="btn" href="articles.html">See all articles</a></div>';
  if(a)document.title=a.title+" · Love Is In The Air";
  return;
}
document.title=a.title+" · Love Is In The Air";

// questions to talk through together, per article
const TALK={
  travel:["How long are we comfortable going between visits?","How much can each of us spend on travel without feeling the pressure?","Is one of us doing more of the traveling, and is that still okay?","How do we want to split the costs, and when should we check in on it again?"],
  trust:["Are we exclusive, and do we both mean the same thing by it?","What should happen when one of us can't make a planned call?","What do we each find reassuring, and is any of it starting to feel like checking up?","Is there something we've been saving for the next visit that we should talk about now?"],
  "love-languages":["What helps you feel loved by me when I'm not there?","When did you last feel especially close to me?","Is there something I used to do that you miss?","What do I do that means more to you than I probably realize?"]
};

let saved=[];try{saved=JSON.parse(localStorage.getItem("ldr-saved-articles"))||[]}catch(e){}
const isSaved=()=>saved.includes(a.id);

main.innerHTML=
 '<div class="tile ahero k-'+a.k+'">'+icon(a)+'</div>'+
 '<header class="head k-'+a.k+'"><div class="meta"><span class="tag">'+esc(a.topic)+'</span><span class="dot"></span><span>'+a.min+' min read</span></div>'+
 '<h1>'+esc(a.title)+'</h1><p class="lede">'+esc(a.sum)+'</p>'+
 '<div class="acts"><button class="chipbtn" type="button" id="save" aria-pressed="'+isSaved()+'">'+HEART+'<span>'+(isSaved()?"Saved":"Save")+'</span></button>'+
 '<button class="chipbtn" type="button" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg><span>Send to your partner</span></button></div></header>'+
 '<div class="wrap"><div class="layout"><nav class="toc" aria-label="In this article"><b>In this article</b></nav><article class="body" id="body">'+a.body+'</article></div>'+
 '<div class="end" aria-hidden="true"><svg viewBox="0 0 24 22"><path d="M12 20C3.5 14.4 1.6 9.8 3.9 6.3 5.9 3.5 9.5 3.9 12 6.7 14.5 3.9 18.1 3.5 20.1 6.3 22.4 9.8 20.5 14.4 12 20Z" fill="currentColor"/></svg></div>'+
 (TALK[a.id]?'<aside class="talk"><b>Talk about it</b><h3>Questions for your next call</h3><ol>'+TALK[a.id].map(q=>"<li>"+esc(q)+"</li>").join("")+'</ol></aside>':"")+
 '</div>'+
 '<section class="more"><div class="wrap"><h2>Keep reading</h2><div class="grid" id="more"></div><div class="allbtn"><a class="btn ghost" href="articles.html">See all articles '+ARROW+'</a></div></div></section>';

// contents, built from the section headings
const body=document.getElementById("body"),toc=main.querySelector(".toc");
const hs=[...body.querySelectorAll("h2")];
hs.forEach((h,i)=>{h.id="s"+(i+1);const l=document.createElement("a");l.href="#"+h.id;l.textContent=h.textContent;toc.appendChild(l)});
const links=[...toc.querySelectorAll("a")],bar=document.getElementById("progress");
function onScroll(){
  const r=body.getBoundingClientRect(),total=r.height-innerHeight*.6;
  bar.style.transform="scaleX("+Math.min(1,Math.max(0,-r.top/(total>0?total:1)))+")";
  let cur=-1;hs.forEach((h,i)=>{if(h.getBoundingClientRect().top<140)cur=i});
  links.forEach((l,i)=>l.classList.toggle("on",i===cur));
}
addEventListener("scroll",onScroll,{passive:true});onScroll();

// save + share
document.getElementById("save").addEventListener("click",e=>{
  const b=e.currentTarget,on=!isSaved();saved=on?[...saved,a.id]:saved.filter(x=>x!==a.id);
  try{localStorage.setItem("ldr-saved-articles",JSON.stringify(saved))}catch(err){}
  b.setAttribute("aria-pressed",on);b.querySelector("span").textContent=on?"Saved":"Save";
});
document.getElementById("share").addEventListener("click",async e=>{
  const span=e.currentTarget.querySelector("span"),data={title:a.title,text:"Thought of us when I read this:",url:location.href};
  try{if(navigator.share){await navigator.share(data);return}await navigator.clipboard.writeText(location.href);span.textContent="Link copied"}
  catch(err){if(err&&err.name!=="AbortError")span.textContent="Copy the address bar link"}
  setTimeout(()=>span.textContent="Send to your partner",2500);
});

// keep reading: finished ones first, then what's coming
const others=window.ARTICLES.filter(x=>x!==a).sort((x,y)=>(!!y.body)-(!!x.body)).slice(0,3);
document.getElementById("more").innerHTML=others.map(x=>
  '<a class="post k-'+x.k+'" href="'+(x.body?"article.html?a="+x.id:"articles.html#"+x.id)+'"><div class="tile">'+icon(x)+'</div><div class="pbody"><div class="meta"><span class="tag">'+esc(x.topic)+'</span><span>'+(x.body?x.min+" min read":"Coming soon")+'</span></div><h3>'+esc(x.title)+'</h3></div></a>').join("");
})();
</script>
</body>
</html>
